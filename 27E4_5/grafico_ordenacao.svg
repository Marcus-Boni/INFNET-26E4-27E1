<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" font-family="Segoe UI, Arial, sans-serif">
  <rect width="840" height="440" fill="#ffffff" rx="8"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Desempenho dos Algoritmos de Ordenação (Crescimento Quadrático O(N²))</text>
  <text x="420" y="54" text-anchor="middle" font-size="12" fill="#6b7280">Tempo de execução (s) em amostras de lista_arquivos.txt (N = 1.000, 5.000, 10.000 e 26.055)</text>

  <!-- Grade horizontal -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="80" y1="350" x2="780" y2="350"/>
    <line x1="80" y1="280" x2="780" y2="280"/>
    <line x1="80" y1="210" x2="780" y2="210"/>
    <line x1="80" y1="140" x2="780" y2="140"/>
    <line x1="80" y1="70" x2="780" y2="70"/>
  </g>

  <!-- Eixos -->
  <line x1="80" y1="70" x2="80" y2="350" stroke="#374151" stroke-width="1.5"/>
  <line x1="80" y1="350" x2="780" y2="350" stroke="#374151" stroke-width="1.5"/>

  <!-- Rótulos Y -->
  <g font-size="12" fill="#4b5563" text-anchor="end">
    <text x="70" y="354">0 s</text>
    <text x="70" y="284">15 s</text>
    <text x="70" y="214">30 s</text>
    <text x="70" y="144">45 s</text>
    <text x="70" y="74">60 s</text>
  </g>
  <text x="24" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#374151" transform="rotate(-90 24 210)">Tempo de Execução (segundos)</text>

  <!-- Rótulos X -->
  <g font-size="12" fill="#4b5563" text-anchor="middle">
    <text x="106" y="372">1.000</text>
    <text x="210" y="372">5.000</text>
    <text x="339" y="372">10.000</text>
    <text x="756" y="372">26.055</text>
  </g>
  <text x="430" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">Quantidade de Arquivos (N)</text>

  <!-- Linhas das séries -->
  <polyline fill="none" stroke="#dc2626" stroke-width="3" points="105.9,349.8 209.6,344.8 339.3,316.0 755.5,79.2"/>
  <polyline fill="none" stroke="#2563eb" stroke-width="3" points="105.9,349.9 209.6,347.3 339.3,327.8 755.5,179.8"/>
  <polyline fill="none" stroke="#059669" stroke-width="3" points="105.9,349.9 209.6,347.2 339.3,332.6 755.5,183.4"/>

  <!-- Pontos Bubble Sort -->
  <g fill="#dc2626">
    <circle cx="105.9" cy="349.8" r="4.5"/>
    <circle cx="209.6" cy="344.8" r="4.5"/>
    <circle cx="339.3" cy="316.0" r="4.5"/>
    <circle cx="755.5" cy="79.2" r="5"/>
    <text x="748" y="72" text-anchor="end" font-size="11" font-weight="700">58,02 s</text>
    <text x="339" y="306" text-anchor="middle" font-size="11">7,29 s</text>
  </g>

  <!-- Pontos Insertion Sort -->
  <g fill="#2563eb">
    <circle cx="105.9" cy="349.9" r="4.5"/>
    <circle cx="209.6" cy="347.3" r="4.5"/>
    <circle cx="339.3" cy="327.8" r="4.5"/>
    <circle cx="755.5" cy="179.8" r="5"/>
    <text x="745" y="170" text-anchor="end" font-size="11" font-weight="700">36,48 s</text>
  </g>

  <!-- Pontos Selection Sort -->
  <g fill="#059669">
    <circle cx="105.9" cy="349.9" r="4.5"/>
    <circle cx="209.6" cy="347.2" r="4.5"/>
    <circle cx="339.3" cy="332.6" r="4.5"/>
    <circle cx="755.5" cy="183.4" r="5"/>
    <text x="745" y="200" text-anchor="end" font-size="11" font-weight="700">35,71 s</text>
  </g>

  <!-- Legenda -->
  <g transform="translate(110, 92)" font-size="12" fill="#1f2937">
    <rect x="-10" y="-14" width="215" height="76" fill="#f9fafb" stroke="#e5e7eb" rx="6"/>
    <line x1="4" y1="2" x2="28" y2="2" stroke="#dc2626" stroke-width="3"/>
    <text x="36" y="6" font-weight="600">Bubble Sort (58,02 s)</text>
    <line x1="4" y1="24" x2="28" y2="24" stroke="#2563eb" stroke-width="3"/>
    <text x="36" y="28" font-weight="600">Insertion Sort (36,48 s)</text>
    <line x1="4" y1="46" x2="28" y2="46" stroke="#059669" stroke-width="3"/>
    <text x="36" y="50" font-weight="600">Selection Sort (35,71 s)</text>
  </g>
</svg>

